version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      web-runtime:
        patterns:
          - "react*"
          - "vite"
          - "@vitejs/*"
          - "@embedpdf/*"
          - "pdf-lib"
          - "pdfjs-dist"
          - "dompurify"
      test-tooling:
        dependency-type: "development"
        patterns:
          - "playwright"
          - "@playwright/*"
          - "vitest"
          - "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
