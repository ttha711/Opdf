name: Rename OPDF to TPDF across repository
on:
  push:
    branches: [main]
    paths:
      - 'scripts/rename-brand.mjs'
      - '.github/workflows/rename-brand.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rename branding in tracked files and paths
        run: node scripts/rename-brand.mjs
      - name: Commit and push migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN cannot update workflows unless granted workflows permission.\n          git restore --source=HEAD --staged --worktree -- .github/workflows\n          git add -A
          if git diff --cached --quiet; then
            echo "No remaining OPDF references in tracked text files."
          else
            git commit -m "refactor: rename OPDF branding to TPDF globally"
            git push origin HEAD:main
          fi
