name: Live CAD Layers E2E
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/components/document-tool-panel/PdfDrawingWorkspace.tsx"
      - "apps/web/src/components/document-tool-panel/CadSnapOverlay.tsx"
      - "apps/web/src/lib/cadVectorSnap.ts"
      - "tests/e2e/live-cad-layers.spec.ts"
      - ".github/workflows/live-cad-layers-e2e.yml"
permissions:
  contents: read
jobs:
  cad-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Verify OCG layer pixels and vector snap
        run: npx playwright test tests/e2e/live-cad-layers.spec.ts --project=chromium --workers=1
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-cad-playwright-trace
          path: |
            test-results/
            playwright-report/
