version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "02:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
