name: UI Audit Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "server/**"
      - "scripts/ui-audit.mjs"
      - "scripts/tpdf-cli.mjs"
      - "scripts/tpdf-cli/**"
      - ".github/workflows/ui-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "server/**"
      - "scripts/ui-audit.mjs"
      - "scripts/tpdf-cli.mjs"
      - "scripts/tpdf-cli/**"
      - ".github/workflows/ui-audit.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run server-build
      - name: Start TPDF server
        run: |
          TPDF_HOST=127.0.0.1 TPDF_PORT=8787 TPDF_DATA_DIR=.tpdf-ui-audit-data npm run server-start > /tmp/tpdf-ui-audit.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/tpdf/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tpdf-ui-audit.log
          exit 1
      - name: Capture UI
        run: node scripts/ui-audit.mjs
      - name: Exercise TPDF production E2E locally
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p tpdf-cli-artifacts
          node scripts/tpdf-cli.mjs audit e2e \
            --url http://127.0.0.1:8787 \
            --timeout 120000 \
            --out tpdf-cli-artifacts \
            --trace tpdf-cli-artifacts/trace.zip \
            --json 2>&1 | tee tpdf-cli-artifacts/console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tpdf-ui-audit
          path: |
            ui-audit/
            tpdf-cli-artifacts/
          retention-days: 14
