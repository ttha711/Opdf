name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:english-ui
      - run: npm run check:file-size
      - run: npm run test:cli
      - run: npm run test -w @opdf/web
      - run: npm run build
      - run: npm run server-smoke
      - run: npm run server-auth-smoke
      - run: npm run server-s3-smoke
      - run: npm run server-production-smoke
      - run: npm run server-reliability
      - run: npm run backup-smoke
      - run: node apps/desktop/dist/main/pdf-signature.smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  office-conversion:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/desktop/tools/requirements.txt
      - run: npm ci
      - run: npm run build --workspace=@opdf/core
      - run: sudo apt-get update && sudo apt-get install -y libreoffice
      - run: python -m pip install -r apps/desktop/tools/requirements.txt
      - run: node scripts/office-conversion-smoke.mjs

  server-tools-e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/desktop/tools/requirements.txt
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libreoffice
      - run: python -m pip install -r apps/desktop/tools/requirements.txt
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test -c playwright.server-tools.config.ts --project=chromium
        timeout-minutes: 18
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-tools-playwright-report
          path: |
            playwright-report/
            test-results/

  windows-desktop:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/desktop/tools/requirements.txt
      - run: npm ci
      - run: choco install libreoffice-fresh -y --no-progress
      - run: python -m pip install -r apps/desktop/tools/requirements.txt
      - run: npm run build --workspace=@opdf/core
      - run: npm run build --workspace=@opdf/web
      - run: npm run build --workspace=@opdf/desktop
      - run: npm run prepare:webdist --workspace=@opdf/desktop
      - run: npx playwright test -c playwright.desktop.config.ts
        timeout-minutes: 12
        env:
          CI: true
          OPDF_SOFFICE_PATH: C:\\Program Files\\LibreOffice\\program\\soffice.exe
      - run: npm run package --workspace=@opdf/desktop -- --win nsis
        timeout-minutes: 15
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          Write-Host "Installer: $($installer.FullName) ($($installer.Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: opdf-windows-installer
          path: apps/desktop/release/*.exe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-playwright-report
          path: |
            playwright-report/
            test-results/

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=chromium --project=mobile-chromium
        timeout-minutes: 10
        env:
          CI: true
      - run: npx playwright test -c playwright.server.config.ts --project=chromium
        timeout-minutes: 12
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/


  browser-compat:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install firefox webkit --with-deps
      - run: npx playwright test tests/e2e/browser-compat.spec.ts --project=firefox --project=webkit
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-compat-playwright-report
          path: |
            playwright-report/
            test-results/
