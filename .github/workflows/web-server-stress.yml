name: Web Server Stress

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "server/**"
      - "scripts/perf/**"
      - "tests/server-e2e/**"
      - "server/opdf-server.reliability.mjs"
      - ".github/workflows/web-server-stress.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  large-pdf-server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web/server runtime
        run: npm run server-build

      - name: Verify persistence and recovery
        run: npm run server-reliability

      - name: Stress 100, 250 and 500 MB PDFs
        run: node scripts/perf/server-large-pdf-smoke.mjs
