name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "refactor/**", "perf/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:english-ui
      - run: npm run check:file-size
      - run: npm run test:cli
      - run: npm run test -w @opdf/web
      - run: npm run build
      - run: npm run server-smoke
      - run: npm run server-reliability
      - run: npm run server-auth-smoke
      - run: node apps/desktop/dist/main/pdf-signature.smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=chromium --project=mobile-chromium
        env:
          CI: true
      - run: npx playwright test -c playwright.server.config.ts --project=chromium
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
