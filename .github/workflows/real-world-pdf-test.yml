name: Real World PDF Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsdot-real-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Build OPDF Server
        run: npm run server-build

      - name: Run real-world WSDOT PDFs
        run: node scripts/perf/real-world-pdf-smoke.mjs
