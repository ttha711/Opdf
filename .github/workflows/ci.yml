name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:english-ui
      - run: npm run check:file-size
      - run: npm run test:cli
      - run: npm run test -w @opdf/web
      - run: npm run build
      - run: npm run server-smoke
      - run: npm run server-auth-smoke
      - run: npm run server-s3-smoke
      - run: npm run server-production-smoke
      - run: npm run server-reliability
      - run: node apps/desktop/dist/main/pdf-signature.smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  office-conversion:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/desktop/tools/requirements.txt
      - run: npm ci
      - run: npm run build --workspace=@opdf/core
      - run: sudo apt-get update && sudo apt-get install -y libreoffice
      - run: python -m pip install -r apps/desktop/tools/requirements.txt
      - run: node scripts/office-conversion-smoke.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=chromium --project=mobile-chromium
        timeout-minutes: 10
        env:
          CI: true
      - run: npx playwright test -c playwright.server.config.ts --project=chromium
        timeout-minutes: 12
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
