name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -w @opdf/web
      - run: npm run build
      - run: npm run server-smoke
      - run: npm run backup-smoke
      - run: node apps/desktop/dist/main/pdf-signature.smoke.js
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=chromium --project=mobile-chromium
        env:
          CI: true
      - run: npx playwright test -c playwright.server.config.ts --project=chromium
        env:
          CI: true

  office-conversion-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Install LibreOffice
        shell: powershell
        run: choco install libreoffice-fresh -y --no-progress
      - name: Build OPDF Server
        run: npm run server-build
      - name: Verify Word Excel PowerPoint to PDF
        shell: powershell
        run: |
          $soffice = "C:\Program Files\LibreOffice\program\soffice.exe"
          if (-not (Test-Path $soffice)) {
            throw "LibreOffice soffice.exe was not found at $soffice"
          }
          $env:OPDF_LIBREOFFICE_PATH = $soffice
          node scripts/office-conversion-smoke.mjs

  hot-update:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build -w @opdf/core
      - run: npm run build -w @opdf/web
      - name: Build hot-update bundle and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hot-update
          (
            cd apps/web/dist
            zip -qr "../../../hot-update/web.zip" .
          )
          SHA256="$(sha256sum hot-update/web.zip | awk '{print $1}')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          node -e '
            const fs = require("fs");
            const [version, sha256] = process.argv.slice(1);
            fs.writeFileSync(
              "hot-update/update-manifest.json",
              JSON.stringify({
                version,
                url: "./web.zip",
                sha256,
                description: "OPDF web hot-update bundle."
              }, null, 2) + "\n"
            );
          ' "$VERSION" "$SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: opdf-hot-update
          path: hot-update/*
          if-no-files-found: error
          retention-days: 14

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            package_glob: apps/desktop/release/*.exe
          - os: macos-latest
            artifact: macos
            package_glob: apps/desktop/release/*.dmg
          - os: ubuntu-latest
            artifact: linux
            package_glob: apps/desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Sync desktop package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          node -e '
            const fs = require("fs");
            const path = "apps/desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"
      - run: npm run build
      - run: npm run desktop-package
      - uses: actions/upload-artifact@v4
        with:
          name: opdf-${{ matrix.artifact }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error
          retention-days: 14

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, hot-update, office-conversion-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opdf-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ARGS=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            "${RELEASE_ARGS[@]}"
