name: UI Audit Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "server/**"
      - "scripts/ui-audit.mjs"
      - "scripts/opdf-cli.mjs"
      - "scripts/opdf-cli/**"
      - ".github/workflows/ui-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "server/**"
      - "scripts/ui-audit.mjs"
      - "scripts/opdf-cli.mjs"
      - "scripts/opdf-cli/**"
      - ".github/workflows/ui-audit.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run server-build
      - name: Start OPDF server
        run: |
          OPDF_HOST=127.0.0.1 OPDF_PORT=8787 OPDF_DATA_DIR=.opdf-ui-audit-data npm run server-start > /tmp/opdf-ui-audit.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/opdf/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/opdf-ui-audit.log
          exit 1
      - name: Capture UI
        run: node scripts/ui-audit.mjs
      - name: Exercise OPDF production E2E locally
        run: |
          set -o pipefail
          mkdir -p opdf-cli-artifacts
          node scripts/opdf-cli.mjs audit e2e \
            --url http://127.0.0.1:8787 \
            --timeout 120000 \
            --out opdf-cli-artifacts \
            --trace opdf-cli-artifacts/trace.zip \
            --json 2>&1 | tee opdf-cli-artifacts/console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opdf-ui-audit
          path: |
            ui-audit/
            opdf-cli-artifacts/
          retention-days: 14
